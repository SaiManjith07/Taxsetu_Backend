<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mock GST Portal - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0b1020;
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
      .shell {
        width: 100%;
        max-width: 1100px;
        margin: 32px;
        background: #111827;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }
      header {
        background: #111827;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #1f2937;
      }
      header h1 {
        margin: 0;
        font-size: 18px;
      }
      header span {
        font-size: 12px;
        color: #9ca3af;
      }
      main {
        padding: 32px 40px 40px;
        background: linear-gradient(120deg, #020617, #020617 40%, #020617);
      }
      .card {
        max-width: 520px;
        background: #020617;
        border-radius: 16px;
        border: 1px solid #1f2937;
        padding: 24px 28px 28px;
      }
      .card h2 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      .card p {
        margin: 0 0 20px;
        font-size: 13px;
        color: #9ca3af;
      }
      label {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
      }
      input[type='text'],
      input[type='password'] {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #374151;
        background: #020617;
        color: #f9fafb;
        font-size: 14px;
        box-sizing: border-box;
      }
      input:focus {
        outline: none;
        border-color: #f97316;
        box-shadow: 0 0 0 1px #f97316;
      }
      .field {
        margin-bottom: 16px;
      }
      .captcha-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #captcha_image {
        width: 160px;
        min-height: 48px;
        border-radius: 8px;
        border: 1px dashed #374151;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        letter-spacing: 4px;
        background: linear-gradient(135deg, #0f172a, #1f2937);
        color: #e5e7eb;
      }
      #captcha_image img {
        max-width: 100%;
        max-height: 56px;
        display: block;
      }
      .actions {
        margin-top: 20px;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      button {
        border: none;
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      #login_btn {
        background: #f97316;
        color: #111827;
      }
      #login_btn:hover {
        background: #fb923c;
      }
      .btn-secondary {
        background: transparent;
        color: #9ca3af;
        border: 1px solid #374151;
      }
      .hint {
        margin-top: 10px;
        font-size: 11px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div>
          <h1>Goods and Services Tax &mdash; Mock Portal</h1>
          <span>Demo environment for TaxSetu filer &amp; guardian</span>
        </div>
        <span>Mock &bull; Not connected to GSTN</span>
      </header>
      <main>
        <div class="card">
          <h2>Login</h2>
          <p>Enter GSTIN and password. CAPTCHA is for demo only.</p>
          <div class="field">
            <label for="username">GSTIN / Username</label>
            <input id="username" type="text" placeholder="Enter GSTIN (e.g. 22AAAAA0000A1Z5)" autocomplete="off" />
          </div>
          <div class="field">
            <label for="user_pass">Password</label>
            <input id="user_pass" type="password" placeholder="Enter password" autocomplete="off" />
          </div>
          <div class="field">
            <label>CAPTCHA</label>
            <div class="captcha-row">
              <div id="captcha_image"></div>
              <input id="captcha_input" type="text" placeholder="Enter characters" autocomplete="off" />
            </div>
          </div>
          <div class="actions">
            <button type="button" class="btn-secondary" onclick="window.location.reload()">Refresh</button>
            <button id="login_btn" type="button">Login</button>
          </div>
          <div class="hint">Puppeteer will type here and proceed to the OTP page.</div>
        </div>
      </main>
    </div>

    <script>
      // Prevent any script from opening new tabs/windows (keep everything in iframe)
      window.open = function () { return null }

      const imgEl = document.getElementById('captcha_image')
      var FALLBACK_DEMO_SVG = 'data:image/svg+xml,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60"><rect fill="#1e293b" width="200" height="60"/><text x="100" y="38" fill="#e2e8f0" text-anchor="middle" font-size="22" font-family="monospace">DEMO12</text></svg>'
      )
      function showCaptchaImage(dataUrl) {
        if (!imgEl) return
        imgEl.textContent = ''
        imgEl.innerHTML = ''
        var src = dataUrl && dataUrl.trim() ? dataUrl : FALLBACK_DEMO_SVG
        var img = document.createElement('img')
        img.src = src
        img.alt = 'CAPTCHA'
        img.style.maxWidth = '100%'
        img.style.maxHeight = '56px'
        img.style.display = 'block'
        imgEl.appendChild(img)
      }
      function showFallbackCaptcha() {
        if (!imgEl) return
        if (imgEl.querySelector('img')) return
        showCaptchaImage(FALLBACK_DEMO_SVG)
      }

      showFallbackCaptcha()

      // Ask parent (FilingWizard) for CAPTCHA and credentials so this mock portal stays in sync (like real portal)
      function requestFromParent() {
        try {
          window.parent.postMessage({ type: 'request-captcha', source: 'mock-login' }, '*')
          window.parent.postMessage({ type: 'request-credentials', source: 'mock-login' }, '*')
        } catch (_) {}
      }
      requestFromParent()
      setTimeout(requestFromParent, 400)
      setTimeout(requestFromParent, 1000)
      setTimeout(requestFromParent, 2000)

      const usernameEl = document.getElementById('username')
      const passwordEl = document.getElementById('user_pass')
      function applyCredentials(gstin, password) {
        if (usernameEl && gstin !== undefined) usernameEl.value = gstin
        if (passwordEl && password !== undefined) passwordEl.value = password
      }

      function sendCaptchaToParent(captcha) {
        try {
          window.parent.postMessage({ type: 'portal-captcha-input', source: 'mock-login', captcha: captcha || '' }, '*')
        } catch (_) {}
      }
      function sendLoginToParent() {
        var cap = (document.getElementById('captcha_input') && document.getElementById('captcha_input').value) || ''
        try {
          window.parent.postMessage({ type: 'portal-login', source: 'mock-login', captcha: cap }, '*')
        } catch (_) {}
      }

      window.addEventListener('message', function (event) {
        if (event.data?.source !== 'taxsetu-wizard') return
        var d = event.data
        if (d.captchaImage) showCaptchaImage(d.captchaImage)
        if (d.gstin !== undefined || d.password !== undefined) applyCredentials(d.gstin, d.password)
        if (d.captchaText !== undefined) {
          var inp = document.getElementById('captcha_input')
          if (inp && inp.value !== d.captchaText) inp.value = d.captchaText
        }
      })

      var captchaInput = document.getElementById('captcha_input')
      if (captchaInput) {
        captchaInput.addEventListener('input', function () { sendCaptchaToParent(this.value) })
        captchaInput.addEventListener('change', function () { sendCaptchaToParent(this.value) })
      }

      // Fallback: if parent still hasn't sent CAPTCHA after a short delay, show DEMO12 so the box is never empty
      setTimeout(showFallbackCaptcha, 300)
      setTimeout(showFallbackCaptcha, 1200)

      document.getElementById('login_btn').addEventListener('click', function () {
        sendLoginToParent()
        // Parent will submit CAPTCHA and change iframe src to mock-otp; if not (e.g. no filer), navigate for demo
        setTimeout(function () {
          try {
            if (window.location.pathname.indexOf('mock-otp') === -1) window.location.href = '/mock-otp.html'
          } catch (_) {}
        }, 400)
      })
    </script>
  </body>
  </html>
