<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mock GST Portal - OTP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0b1020;
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
      .shell {
        width: 100%;
        max-width: 900px;
        margin: 32px;
        background: #111827;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }
      header {
        background: #111827;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #1f2937;
      }
      header h1 {
        margin: 0;
        font-size: 18px;
      }
      header span {
        font-size: 12px;
        color: #9ca3af;
      }
      main {
        padding: 32px 40px 40px;
        background: #020617;
      }
      .card {
        max-width: 480px;
        background: #020617;
        border-radius: 16px;
        border: 1px solid #1f2937;
        padding: 24px 28px 28px;
      }
      .card h2 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      .card p {
        margin: 0 0 20px;
        font-size: 13px;
        color: #9ca3af;
      }
      label {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
      }
      input[type='text'] {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #374151;
        background: #020617;
        color: #f9fafb;
        font-size: 14px;
        box-sizing: border-box;
      }
      input:focus {
        outline: none;
        border-color: #22c55e;
        box-shadow: 0 0 0 1px #22c55e;
      }
      .field {
        margin-bottom: 16px;
      }
      .actions {
        margin-top: 20px;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      button {
        border: none;
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      #otp_submit_btn {
        background: #22c55e;
        color: #022c22;
      }
      #otp_submit_btn:hover {
        background: #4ade80;
      }
      .btn-secondary {
        background: transparent;
        color: #9ca3af;
        border: 1px solid #374151;
      }
      .hint {
        margin-top: 10px;
        font-size: 11px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div>
          <h1>Goods and Services Tax &mdash; Mock Portal</h1>
          <span>OTP verification</span>
        </div>
        <span>Mock &bull; Not connected to GSTN</span>
      </header>
      <main>
        <div class="card">
          <h2>Enter OTP</h2>
          <p>We sent a demo OTP to your registered mobile / email (for testing, use any 6 digits).</p>
          <div class="field">
            <label for="otp_input">OTP</label>
            <input id="otp_input" type="text" placeholder="Enter 6 digits" autocomplete="off" />
          </div>
          <div class="actions">
            <button type="button" class="btn-secondary" onclick="window.location.href = '/mock-login.html'">
              Back
            </button>
            <button id="otp_submit_btn" type="button">Verify &amp; Continue</button>
          </div>
          <div class="hint">On success you will be taken to the mock GSTR-3B form.</div>
        </div>
      </main>
    </div>

    <script>
      window.open = function () { return null }
      document.getElementById('otp_submit_btn').addEventListener('click', () => {
        window.location.href = '/mock-gstr3b.html'
      })
    </script>
  </body>
  </html>
